<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>개인용 영양제 타임라인</title>

  <!-- 💊 아이폰 PWA 전용 알약 아이콘 -->
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/180/pill.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 flex justify-center items-start">

  <div class="w-full max-w-md space-y-6">
    <!-- 헤더 -->
    <div class="text-center space-y-2">
      <h1 class="text-2xl font-bold flex items-center justify-center gap-2">
        <span>💊</span> 나의 영양제 타임라인
      </h1>
      <p class="text-xs text-slate-400">성분별 최적의 복용 시간에 맞춘 영양제 관리</p>
    </div>

    <!-- 복용 달성률 프로그레스 바 -->
    <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700 space-y-2 shadow-lg">
      <div class="flex justify-between items-center text-xs">
        <span class="text-slate-400 font-medium">오늘의 복용 달성률</span>
        <span id="progress-text" class="text-emerald-400 font-bold">0% (0/0개 완료)</span>
      </div>
      <div class="w-full bg-slate-700 h-2.5 rounded-full overflow-hidden">
        <div id="progress-bar" class="bg-emerald-500 h-full w-0 transition-all duration-500"></div>
      </div>
    </div>

    <!-- 푸시 알림 권한 및 테스트 버튼 -->
    <div class="bg-slate-800/50 p-3 rounded-2xl border border-slate-700/60 text-center">
      <button onclick="requestAndTestNotification()" 
              class="w-full py-2 px-3 bg-slate-700 hover:bg-slate-600 text-xs text-slate-200 font-medium rounded-xl border border-slate-600 transition-all flex items-center justify-center gap-2">
        <span>🔔</span> 앱 알림 권한 허용 및 테스트
      </button>
      <div id="permission-status" class="text-[11px] text-slate-400 mt-2">
        알림 권한 상태 확인 중...
      </div>
    </div>

    <!-- 영양제 추가 양식 -->
    <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700 space-y-3 shadow-lg">
      <div class="text-xs font-semibold text-slate-300">새 영양제 추가하기</div>
      
      <div class="space-y-2">
        <input type="text" id="item-name" placeholder="제품명 입력 (예: 닥터스베스트 커큐민)" 
               class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500">
        
        <select id="item-ingredient" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
          <optgroup label="🌅 아침 공복 (07:30)">
            <option value="유산균(프로바이오틱스)">유산균(프로바이오틱스)</option>
            <option value="프리바이오틱스">프리바이오틱스</option>
            <option value="철분">철분</option>
            <option value="L-아르기닌">L-아르기닌</option>
            <option value="콜라겐">콜라겐</option>
            <option value="MSM(식이유황)">MSM(식이유황)</option>
          </optgroup>
          <optgroup label="☀️ 아침 식후 (08:30)">
            <option value="비타민B군">비타민B군</option>
            <option value="종합비타민">종합비타민</option>
            <option value="비타민C">비타민C</option>
            <option value="홍삼/인삼">홍삼/인삼</option>
            <option value="코엔자임Q10">코엔자임Q10</option>
            <option value="옥타코사놀">옥타코사놀</option>
          </optgroup>
          <optgroup label="🍽️ 점심 식후 (13:00)">
            <option value="오메가3">오메가3</option>
            <option value="비타민D">비타민D</option>
            <option value="루테인/지아잔틴">루테인/지아잔틴</option>
            <option value="밀크씨슬(실리마린)">밀크씨슬(실리마린)</option>
            <option value="커큐민" selected>커큐민</option>
            <option value="비타민A">비타민A</option>
            <option value="비타민E">비타민E</option>
            <option value="크릴오일">크릴오일</option>
            <option value="아스타잔틴">아스타잔틴</option>
          </optgroup>
          <optgroup label="🌙 저녁 식후 (19:30)">
            <option value="아연">아연</option>
            <option value="글루타치온">글루타치온</option>
            <option value="바나바잎">바나바잎</option>
            <option value="프로폴리스">프로폴리스</option>
            <option value="알파리포산">알파리포산</option>
          </optgroup>
          <optgroup label="🛌 취침 전 (22:00)">
            <option value="마그네슘">마그네슘</option>
            <option value="칼슘">칼슘</option>
            <option value="L-테아닌">L-테아닌</option>
            <option value="타트체리">타트체리</option>
            <option value="감태추출물">감태추출물</option>
          </optgroup>
        </select>
      </div>

      <button onclick="addSupplement()" 
              class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 font-semibold text-xs text-white rounded-xl transition-all shadow-md active:scale-[0.98]">
        + 영양제 목록에 추가하기
      </button>
    </div>

    <!-- 영양제 타임라인 리스트 -->
    <div id="timeline-list" class="space-y-2.5">
      <!-- 자바스크립트로 동적 생성됨 -->
    </div>
  </div>

  <script>
    // 성분별 최적 복용 시간 데이터베이스
    const TIME_MAP = {
      '유산균(프로바이오틱스)': { slot: '아침 공복', time: '07:30', tip: '위산이 적은 공복에 미지근한 물과 함께' },
      '프리바이오틱스': { slot: '아침 공복', time: '07:30', tip: '유산균의 먹이, 공복 섭취 권장' },
      '철분': { slot: '아침 공복', time: '07:30', tip: '공복 흡수율 높음 (위장장애 시 식후로 이동)' },
      'L-아르기닌': { slot: '아침 공복', time: '07:30', tip: '다른 아미노산과 흡수 경쟁을 피하기 위해 공복' },
      '콜라겐': { slot: '아침 공복', time: '07:30', tip: '공복 흡수가 용이' },
      'MSM(식이유황)': { slot: '아침 공복', time: '07:30', tip: '관절 건강, 아침 공복 또는 식후' },

      '비타민B군': { slot: '아침 식후', time: '08:30', tip: '에너지 대사 활성화 (밤 복용 시 수면 방해 가능)' },
      '종합비타민': { slot: '아침 식후', time: '08:30', tip: '하루 활력 충전 및 위장 장애 예방' },
      '비타민C': { slot: '아침 식후', time: '08:30', tip: '산성이 강해 식사 직후 복용 추천' },
      '홍삼/인삼': { slot: '아침 식후', time: '08:30', tip: '낮 시간 피로 회복 및 면역력 증진' },
      '코엔자임Q10': { slot: '아침 식후', time: '08:30', tip: '항산화 및 에너지 생성' },
      '옥타코사놀': { slot: '아침 식후', time: '08:30', tip: '지구력 증진, 오전에 복용' },

      '오메가3': { slot: '점심 식후', time: '13:00', tip: '지방이 포함된 식사 직후에 흡수율 극대화' },
      '비타민D': { slot: '점심 식후', time: '13:00', tip: '지용성 비타민, 지방과 함께 섭취' },
      '루테인/지아잔틴': { slot: '점심 식후', time: '13:00', tip: '지용성 성분으로 식사 직후 섭취' },
      '밀크씨슬(실리마린)': { slot: '점심 식후', time: '13:00', tip: '간 건강 관리, 식후 복용 권장' },
      '커큐민': { slot: '점심 식후', time: '13:00', tip: '지용성 항염 성분으로 지방이 포함된 식사 직후 섭취 권장' },
      '비타민A': { slot: '점심 식후', time: '13:00', tip: '지용성 비타민' },
      '비타민E': { slot: '점심 식후', time: '13:00', tip: '지용성 항산화 비타민' },
      '크릴오일': { slot: '점심 식후', time: '13:00', tip: '지용성 성분, 식후 섭취' },
      '아스타잔틴': { slot: '점심 식후', time: '13:00', tip: '눈 피로 개선 항산화제' },

      '아연': { slot: '저녁 식후', time: '19:30', tip: '면역 기능, 위장 보호를 위해 식후' },
      '글루타치온': { slot: '저녁 식후', time: '19:30', tip: '항산화 및 세포 재생' },
      '바나바잎': { slot: '저녁 식후', time: '19:30', tip: '식후 혈당 상승 억제' },
      '프로폴리스': { slot: '저녁 식후', time: '19:30', tip: '항균 및 면역 케어' },
      '알파리포산': { slot: '저녁 식후', time: '19:30', tip: '항산화 대사' },

      '마그네슘': { slot: '취침 전', time: '22:00', tip: '근육 이완 및 신경 안정, 숙면 유도' },
      '칼슘': { slot: '취침 전', time: '22:00', tip: '뼈 건강 및 신경 안정' },
      'L-테아닌': { slot: '취침 전', time: '22:00', tip: '뇌파 알파파 발생, 스트레스 완화' },
      '타트체리': { slot: '취침 전', time: '22:00', tip: '식물성 멜라토닌 풍부' },
      '감태추출물': { slot: '취침 전', time: '22:00', tip: '수면의 질 개선' }
    };

    // 💡 핸드폰 저장공간(localStorage)에서 데이터 가져오기 및 초기화
    const savedData = localStorage.getItem('my_supplements');
    let supplements = savedData ? JSON.parse(savedData) : [
      { id: 1, name: '락토핏 생유산균', ingredient: '유산균(프로바이오틱스)', slot: '아침 공복', time: '07:30', tip: '위산이 적은 공복에 미지근한 물과 함께', completed: false },
      { id: 2, name: '임팩타민 프리미엄', ingredient: '비타민B군', slot: '아침 식후', time: '08:30', tip: '에너지 대사 활성화', completed: true },
      { id: 3, name: '스포츠리서치 오메가3', ingredient: '오메가3', slot: '점심 식후', time: '13:00', tip: '지방이 포함된 식사 직후에 흡수율 극대화', completed: false },
      { id: 4, name: '테라큐민 파워', ingredient: '커큐민', slot: '점심 식후', time: '13:00', tip: '지용성 항염 성분으로 지방이 포함된 식사 직후 섭취 권장', completed: false },
      { id: 5, name: '닥터스베스트 마그네슘', ingredient: '마그네슘', slot: '취침 전', time: '22:00', tip: '근육 이완 및 신경 안정, 숙면 유도', completed: false }
    ];

    function saveData() {
      localStorage.setItem('my_supplements', JSON.stringify(supplements));
    }

    function render() {
      supplements.sort((a, b) => a.time.localeCompare(b.time));

      const listEl = document.getElementById('timeline-list');
      if (!listEl) return;
      listEl.innerHTML = '';

      if (supplements.length === 0) {
        listEl.innerHTML = `<div class="text-center text-xs text-slate-500 py-8">등록된 영양제가 없습니다. 상단에서 추가해 주세요!</div>`;
      } else {
        supplements.forEach(item => {
          const div = document.createElement('div');
          div.className = `p-3 rounded-xl border transition-all ${
            item.completed ? 'bg-slate-900/40 border-slate-800 opacity-60' : 'bg-slate-800/80 border-slate-700'
          }`;
          
          div.innerHTML = `
            <div class="flex items-start justify-between gap-2">
              <div class="flex items-start gap-3">
                <input type="checkbox" ${item.completed ? 'checked' : ''} 
                       onclick="toggleItem(${item.id})"
                       class="w-5 h-5 mt-0.5 accent-emerald-500 rounded cursor-pointer">
                <div>
                  <div class="text-sm font-medium ${item.completed ? 'line-through text-slate-400' : 'text-slate-100'}">
                    ${item.name}
                  </div>
                  <div class="text-[11px] text-emerald-400 font-medium mt-0.5">
                    ⏰ ${item.slot} (${item.time}) · <span class="text-slate-300">${item.ingredient}</span>
                  </div>
                  <div class="text-[10px] text-slate-400 mt-0.5">
                    💡 ${item.tip}
                  </div>
                </div>
              </div>
              <button onclick="deleteItem(${item.id})" class="text-xs text-slate-500 hover:text-red-400 px-1 py-0.5">삭제</button>
            </div>
          `;
          listEl.appendChild(div);
        });
      }

      const completedCount = supplements.filter(s => s.completed).length;
      const totalCount = supplements.length;
      const percent = totalCount === 0 ? 0 : Math.round((completedCount / totalCount) * 100);

      const barEl = document.getElementById('progress-bar');
      const textEl = document.getElementById('progress-text');
      if (barEl) barEl.style.width = percent + '%';
      if (textEl) textEl.innerText = `${percent}% (${completedCount}/${totalCount}개 완료)`;

      updatePermissionStatus();
    }

    function addSupplement() {
      const nameInput = document.getElementById('item-name');
      const ingredientSelect = document.getElementById('item-ingredient');

      const name = nameInput.value.trim() || ingredientSelect.value;
      const ingredient = ingredientSelect.value;

      const rule = TIME_MAP[ingredient] || { slot: '아침 식후', time: '08:30', tip: '식후 복용 추천' };

      const newItem = {
        id: Date.now(),
        name: name,
        ingredient: ingredient,
        slot: rule.slot,
        time: rule.time,
        tip: rule.tip,
        completed: false
      };

      supplements.push(newItem);
      saveData();
      nameInput.value = '';
      render();
    }

    function toggleItem(id) {
      supplements = supplements.map(s => s.id === id ? { ...s, completed: !s.completed } : s);
      saveData();
      render();
    }

    function deleteItem(id) {
      supplements = supplements.filter(s => s.id !== id);
      saveData();
      render();
    }

    function updatePermissionStatus() {
      const statusEl = document.getElementById('permission-status');
      if (!statusEl) return;

      if (!("Notification" in window)) {
        statusEl.innerText = "⚠️ 이 브라우저는 푸시 알림을 지원하지 않습니다.";
        statusEl.className = "text-[11px] text-center text-amber-400 mt-2";
        return;
      }

      if (Notification.permission === "granted") {
        statusEl.innerText = "✅ 알림 권한이 허용되었습니다. (설정된 시간에 자동 알림이 도착합니다)";
        statusEl.className = "text-[11px] text-center text-emerald-400 mt-2";
      } else if (Notification.permission === "denied") {
        statusEl.innerText = "❌ 알림 권한이 거부되었습니다. (주소창 왼쪽 설정에서 허용해 주세요)";
        statusEl.className = "text-[11px] text-center text-rose-400 mt-2";
      } else {
        statusEl.innerText = "ℹ️ 위 버튼을 눌러 알림 권한을 허용해 주세요.";
        statusEl.className = "text-[11px] text-center text-sky-400 mt-2";
      }
    }

    function requestAndTestNotification() {
      if (!("Notification" in window)) {
        alert("이 브라우저는 알림 기능을 지원하지 않습니다.");
        return;
      }

      if (Notification.permission === "granted") {
        triggerNotification("🔔 [알림 테스트]", "브라우저 푸시 알림이 정상 작동합니다!");
      } else if (Notification.permission !== "denied") {
        Notification.requestPermission().then(permission => {
          if (permission === "granted") {
            triggerNotification("🔔 [알림 테스트]", "알림 권한이 허용되었습니다!");
          } else {
            alert("알림 권한이 거부되었습니다.");
          }
          updatePermissionStatus();
        });
      } else {
        alert("알림 권한이 차단되어 있습니다. 브라우저 주소창 왼쪽 아이콘을 눌러 알림을 허용으로 변경해 주세요.");
      }
    }

    function triggerNotification(title, body) {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification(title, {
          body: body,
          icon: 'https://img.icons8.com/color/180/pill.png'
        });
      }
    }

    let lastNotifiedMin = "";
    setInterval(() => {
      if (!("Notification" in window) || Notification.permission !== "granted") return;

      const now = new Date();
      const currentHHMM = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      if (lastNotifiedMin === currentHHMM) return;

      const dueItems = supplements.filter(s => !s.completed && s.time === currentHHMM);

      if (dueItems.length > 0) {
        lastNotifiedMin = currentHHMM;
        const itemNames = dueItems.map(s => s.name).join(', ');
        triggerNotification(
          `💊 [영양제 복용 시간 - ${currentHHMM}]`,
          `지금 챙겨 드세요: ${itemNames}`
        );
      }
    }, 10000);

    // 초기 실행
    render();
  </script>
</body>
</html>
